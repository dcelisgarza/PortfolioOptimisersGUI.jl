name: Aqua

on:
  push:
    branches:
      - main
      - dev*
      - agents/*
    tags: ["*"]
  workflow_dispatch:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: julia-actions/setup-julia@latest
        with:
          version: '1'
      - uses: actions/checkout@v7
      - name: Aqua
        shell: julia --color=yes {0}
        run: |
          using Pkg
          Pkg.add(PackageSpec(name="Aqua"))
          Pkg.develop(PackageSpec(path=pwd()))
          using PortfolioOptimisersGUI, Aqua
          Aqua.test_ambiguities(PortfolioOptimisersGUI)
          Aqua.test_unbound_args(PortfolioOptimisersGUI)
          Aqua.test_undefined_exports(PortfolioOptimisersGUI)
          Aqua.test_project_extras(PortfolioOptimisersGUI)
          Aqua.test_stale_deps(PortfolioOptimisersGUI)
          Aqua.test_piracies(PortfolioOptimisersGUI)
          Aqua.test_persistent_tasks(PortfolioOptimisersGUI)
          Aqua.test_deps_compat(PortfolioOptimisersGUI)
